[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xuanspace"
version = "0.1.0"
description = "Xuanspace（玄境）- Python monorepo 项目"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.13"
authors = [
    {name = "xinetzone"}
]
maintainers = [
    {name = "xinetzone"}
]
keywords = [
    "xuanspace",
    "xuanjing",
    "monorepo",
    "python",
    "machine-learning",
    "deep-learning"
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules"
]

[project.optional-dependencies]
docs = [
    "sphinx>=8.0",
    "myst-parser>=4.0",
    "sphinx-book-theme>=1.1",
    "sphinx-design",
    "sphinx-copybutton",
    "sphinxcontrib-mermaid",
]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.5",
]
lint = [
    "mypy>=1.10",
    "ruff>=0.4",
    "black>=24.4",
    "isort>=5.13",
]
build = [
    "build>=1.2",
    "scikit-build-core>=0.10",
    "cmake>=3.26",
    "ninja",
]
dev = [
    "pdm",
    "typer>=0.12",
    "rich>=13.0",
    "packaging>=24.0",
    "tomli-w>=1.0",
    "sphinx>=8.0",
    "myst-parser>=4.0",
    "sphinx-book-theme>=1.1",
    "sphinx-design",
    "sphinx-copybutton",
    "sphinxcontrib-mermaid",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.5",
    "mypy>=1.10",
    "ruff>=0.4",
    "black>=24.4",
    "isort>=5.13",
    "build>=1.2",
    "scikit-build-core>=0.10",
    "cmake>=3.26",
    "ninja",
]

[dependency-groups]
dev = [
    {include-group = "docs"},
    {include-group = "test"},
    {include-group = "lint"},
    {include-group = "build"},
    "pdm",
    "typer>=0.12",
    "rich>=13.0",
    "packaging>=24.0",
    "tomli-w>=1.0",
]
docs = [
    "sphinx>=8.0",
    "myst-parser>=4.0",
    "sphinx-book-theme>=1.1",
    "sphinx-design",
    "sphinx-copybutton",
    "sphinxcontrib-mermaid",
]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.5",
]
lint = [
    "mypy>=1.10",
    "ruff>=0.4",
    "black>=24.4",
    "isort>=5.13",
]
build = [
    "build>=1.2",
    "scikit-build-core>=0.10",
    "cmake>=3.26",
    "ninja",
]

[tool.pdm.workspace]
packages = [
    {from = "apps"},
    {from = "libs"},
    {from = "tools"}
]

[tool.setuptools.packages.find]
where = ["."]
include = []
exclude = [
    "apps*",
    "libs*",
    "vendor*",
    "tools*",
    "docs*",
    "scripts*",
    "attic*",
    ".agents*",
    ".meta*",
    "build*",
    "dist*"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config"
]

[tool.ruff]
line-length = 120
target-version = "py313"
exclude = [
    "vendor",
    "libs/tvm-book",
    "attic",
    ".agents",
    "build",
    "dist",
    ".git",
    "__pycache__",
    "*.egg-info",
    "tools/templates",
    ".test-venv",
]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "UP",
]
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = false
ignore_missing_imports = true
warn_return_any = false
warn_unused_configs = true
exclude = [
    "vendor/",
    "libs/tvm-book/",
    "attic/",
    "build/",
    "dist/",
    "tools/templates/",
    ".test-venv/",
]

[tool.black]
line-length = 120
target-version = ["py313"]

[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3
