name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ============================================
  # 跨平台 + 多包管理器 测试矩阵
  # ============================================
  test:
    name: "${{ matrix.os }} / ${{ matrix.pm }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        pm: [pdm, pip, uv]
    env:
      PDM_NO_EDITABLE: "1"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # --- CMake + Ninja 安装 ---
      - name: Install CMake + Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

      - name: Install CMake + Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake ninja

      - name: Install CMake + Ninja (Windows)
        if: runner.os == 'Windows'
        run: pip install cmake ninja

      # --- PDM 安装 ---
      - name: Install PDM
        if: matrix.pm == 'pdm'
        run: pip install pdm

      # --- uv 安装 ---
      - name: Install uv
        if: matrix.pm == 'uv'
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      # --- 安装依赖 ---
      - name: Install dependencies (PDM)
        if: matrix.pm == 'pdm'
        run: pdm install

      - name: Install dependencies (pip)
        if: matrix.pm == 'pip'
        run: pip install -e ".[dev]"

      - name: Install dependencies (uv)
        if: matrix.pm == 'uv'
        run: uv pip install --system -e ".[dev]"

      # --- 工具链检查 ---
      - name: Check toolchain
        run: xs toolchain check

      # --- 代码质量 ---
      - name: Run ruff linter
        run: ruff check .

      - name: Check code formatting
        run: ruff format --check .

      - name: Run mypy type checker
        run: mypy tools/xs libs/

      # --- 测试 ---
      - name: Run tests
        shell: bash
        run: |
          if [ -d "tests" ]; then
            pytest
          else
            echo "No tests/ directory found, skipping pytest"
          fi

      # --- 环境诊断 ---
      - name: Run xs doctor
        run: xs doctor

      # --- 项目发现 ---
      - name: List all projects
        run: xs list

      - name: List projects (JSON)
        run: xs list --json

      # --- 构建验证 ---
      - name: Build all projects
        run: xs build

      # --- 文档构建 ---
      - name: Build documentation
        run: xs docs build

      # --- 链接检查 ---
      - name: Check documentation links
        run: xs docs linkcheck
        continue-on-error: true

  # ============================================
  # Python 版本兼容性检查
  # ============================================
  py-compat:
    name: Python Compatibility Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install project
        run: pip install -e ".[dev]"

      - name: Check Python compatibility
        run: xs py-compat

      # 验证 Python < 3.13 时明确拒绝
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify Python < 3.13 is rejected
        run: |
          pip install -e ".[dev]" 2>&1 || true
          xs --version 2>&1 || echo "Python 3.12 correctly rejected"