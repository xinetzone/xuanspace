name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ============================================
  # 跨平台 + 多包管理器 测试矩阵
  # ============================================
  test:
    name: "${{ matrix.os }} / ${{ matrix.pm }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        pm: [pdm, pip, uv]
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # --- CMake + Ninja 安装 ---
      - name: Install CMake + Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

      - name: Install CMake + Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake ninja

      - name: Install CMake + Ninja (Windows)
        if: runner.os == 'Windows'
        run: python -m pip install cmake ninja

      # --- PDM 安装 ---
      - name: Install PDM
        if: matrix.pm == 'pdm'
        run: python -m pip install pdm

      # --- uv 安装 ---
      - name: Install uv
        if: matrix.pm == 'uv'
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      # --- 安装依赖 ---
      - name: Install dependencies (PDM)
        if: matrix.pm == 'pdm'
        run: python -m pdm install

      - name: Install dependencies (pip)
        if: matrix.pm == 'pip'
        run: python -m pip install -e ".[dev]"

      - name: Install dependencies (uv)
        if: matrix.pm == 'uv'
        run: uv pip install --system -e ".[dev]"

      # --- 安装 xs-cli 工具（本地包，不在 PyPI）---
      - name: Install xs-cli
        run: |
          if [ "${{ matrix.pm }}" = "uv" ]; then
            uv pip install --system -e tools/xs/
          else
            python -m pip install -e tools/xs/
          fi

      # --- 工具链检查 ---
      - name: Check toolchain
        run: xs toolchain check

      # --- 代码质量 ---
      - name: Run ruff linter
        run: python -m ruff check .

      - name: Check code formatting
        run: python -m ruff format --check .

      - name: Run mypy type checker
        run: python -m mypy tools/xs libs/xuan-core libs/xuan-ext-demo

      # --- 测试 ---
      - name: Run tests
        run: |
          if [ -d "tests" ]; then
            python -m pytest
          else
            echo "No tests/ directory found, skipping pytest"
          fi

      # --- 环境诊断 ---
      - name: Run xs doctor
        run: xs doctor

      # --- 项目发现 ---
      - name: List all projects
        run: xs list

      - name: List projects (JSON)
        run: xs list --json

      # --- 构建验证 ---
      - name: Build all projects
        run: xs build

      # --- Windows DLL 自检 (A3) ---
      - name: Run Windows DLL self-check
        if: runner.os == 'Windows'
        run: python libs/caffe-ffi/scripts/check_windows_dll.py --skip-load

      # --- 文档构建 ---
      - name: Build documentation
        run: xs docs build

      # --- 链接检查 ---
      - name: Check documentation links
        run: xs docs linkcheck
        continue-on-error: true

  # ============================================
  # 质量门禁：四项自动化检查（doctor/meta/lfs/docs）
  # ============================================
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install CMake + Ninja
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Install xs-cli
        run: python -m pip install -e tools/xs/

      # --- 1. 环境诊断 ---
      - name: xs doctor
        run: xs doctor

      # --- 2. 元数据校验 ---
      - name: xs meta validate
        run: xs meta validate

      # --- 3. LFS 大文件检查 ---
      - name: xs lfs check
        run: xs lfs check

      # --- 4. 文档构建 ---
      - name: xs docs build
        run: xs docs build

  # ============================================
  # 模板验证：三平台（Windows/macOS/Linux）模板创建 + 构建
  # ============================================
  template-validation:
    name: "Template / ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # --- CMake + Ninja 安装 ---
      - name: Install CMake + Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

      - name: Install CMake + Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake ninja

      - name: Install CMake + Ninja (Windows)
        if: runner.os == 'Windows'
        run: python -m pip install cmake ninja

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Install xs-cli
        run: python -m pip install -e tools/xs/

      # --- Python 模板 ---
      - name: Create Python template project
        run: xs new --type python test-python-tpl

      - name: Build Python template project
        run: |
          cd test-python-tpl
          python -m pip install -e .

      # --- Native 模板 ---
      - name: Create Native template project
        run: xs new --type native test-native-tpl

      - name: Build Native template project
        run: |
          cd test-native-tpl
          python -m pip install -e . -v

      # --- Static 模板 ---
      - name: Create Static template project
        run: xs new --type static test-static-tpl

      - name: Verify Static template project
        run: |
          test -f test-static-tpl/index.html && echo "Static template OK"

  # ============================================
  # Python 版本兼容性检查
  # ============================================
  py-compat:
    name: Python Compatibility Check
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Install xs-cli
        run: python -m pip install -e tools/xs/

      - name: Check Python compatibility
        run: xs py-compat

      # 验证 Python < 3.14.6 时明确拒绝
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Verify Python < 3.14.6 is rejected
        run: |
          python -m pip install -e ".[dev]" 2>&1 || true
          xs --version 2>&1 || echo "Python 3.13 correctly rejected"
