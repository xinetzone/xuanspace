name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Windows runner 默认编码非 UTF-8，强制 UTF-8 避免 Python 输出中文时
  # 抛 UnicodeEncodeError（覆盖 pytest/mypy 等非 xs 进程）
  PYTHONUTF8: "1"

jobs:
  # ============================================
  # 跨平台 + 多包管理器 测试矩阵
  # ============================================
  test:
    name: "${{ matrix.os }} / ${{ matrix.pm }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        pm: [pdm, pip, uv]
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # --- CMake + Ninja 安装 ---
      - name: Install CMake + Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

      - name: Install CMake + Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake ninja

      - name: Install CMake + Ninja (Windows)
        if: runner.os == 'Windows'
        run: python -m pip install cmake ninja

      # --- PDM 安装 ---
      - name: Install PDM
        if: matrix.pm == 'pdm'
        run: python -m pip install pdm

      # --- uv 安装 ---
      - name: Install uv
        if: matrix.pm == 'uv'
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      # --- 安装依赖 ---
      - name: Install dependencies (PDM)
        if: matrix.pm == 'pdm'
        run: |
          python -m pdm install -G dev
          # pdm 创建的 venv 默认不含 pip，为后续 "Install xs-cli" 的
          # pip install 补齐；随后将 venv 的 bin 目录前置到 PATH，
          # 使后续步骤的 python/xs 调用透明使用 pdm 管理的环境
          if [ -f ".venv/bin/python" ] || [ -f ".venv/Scripts/python.exe" ]; then
            "$PWD/.venv/bin/python" -m ensurepip --upgrade >/dev/null 2>&1 || \
              "$PWD/.venv/Scripts/python.exe" -m ensurepip --upgrade >/dev/null 2>&1 || true
          fi
          if [ -d ".venv/bin" ]; then
            echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          else
            echo "$PWD/.venv/Scripts" >> "$GITHUB_PATH"
          fi

      - name: Install dependencies (pip)
        if: matrix.pm == 'pip'
        run: python -m pip install -e ".[dev]"

      - name: Install dependencies (uv)
        if: matrix.pm == 'uv'
        run: uv pip install --system -e ".[dev]"

      # --- 安装插件内核（本地包，xs 的运行时依赖，不在 PyPI）---
      - name: Install xuan-plugin kernel
        run: |
          if [ "${{ matrix.pm }}" = "uv" ]; then
            uv pip install --system -e "libs/xuan-plugin[test]"
          else
            python -m pip install -e "libs/xuan-plugin[test]"
          fi

      # --- 安装构建能力层（本地包，xs 的运行时依赖，不在 PyPI）---
      - name: Install xuan-build capability
        run: |
          if [ "${{ matrix.pm }}" = "uv" ]; then
            uv pip install --system -e "libs/xuan-build[test]"
          else
            python -m pip install -e "libs/xuan-build[test]"
          fi

      # --- 安装 FFI 能力层（本地包，xs 的运行时依赖，不在 PyPI）---
      - name: Install xuan-ffi capability
        run: |
          if [ "${{ matrix.pm }}" = "uv" ]; then
            uv pip install --system -e "libs/xuan-ffi[test]"
          else
            python -m pip install -e "libs/xuan-ffi[test]"
          fi

      # --- 安装项目发现层（本地包，xs 的运行时依赖，不在 PyPI）---
      - name: Install xuan-project capability
        run: |
          if [ "${{ matrix.pm }}" = "uv" ]; then
            uv pip install --system -e "libs/xuan-project[test]"
          else
            python -m pip install -e "libs/xuan-project[test]"
          fi

      # --- 安装 xs-cli 工具（本地包，不在 PyPI）---
      - name: Install xs-cli
        run: |
          if [ "${{ matrix.pm }}" = "uv" ]; then
            uv pip install --system -e tools/xs/
          else
            python -m pip install -e tools/xs/
          fi

      # --- 工具链检查 ---
      - name: Check toolchain
        run: xs toolchain check

      # --- 代码质量 ---
      - name: Run ruff linter
        run: python -m ruff check .

      - name: Check code formatting
        run: python -m ruff format --check .

      - name: Run mypy type checker
        run: python -m mypy tools/xs libs/xuan-core libs/xuan-ext-demo libs/xuan-cmd libs/xuan-build libs/xuan-ffi libs/xuan-plugin libs/xuan-project

      # --- 测试 ---
      - name: Run tests
        run: |
          if [ -d "tests" ]; then
            python -m pytest
          else
            echo "No tests/ directory found, skipping pytest"
          fi

      # --- 环境诊断 ---
      - name: Run xs doctor
        run: xs doctor

      # --- 项目发现 ---
      - name: List all projects
        run: xs list

      - name: List projects (JSON)
        run: xs list --json

      # --- 构建验证 ---
      - name: Build all projects
        run: xs build --type all

      # --- Windows DLL 自检 (A3)：仅当 caffe-ffi 已有构建产物时执行
      #（CI 裸环境无 Protobuf/OpenBLAS，caffe-ffi 声明 auto-build=false）---
      - name: Run Windows DLL self-check
        if: runner.os == 'Windows' && hashFiles('libs/caffe-ffi/build/**/*.dll') != ''
        run: python libs/caffe-ffi/scripts/check_windows_dll.py --skip-load

      # --- 文档构建 ---
      - name: Build documentation
        run: xs doc build

      # --- 链接检查 ---
      - name: Check documentation links
        run: xs doc linkcheck

  # ============================================
  # 质量门禁：八项自动化检查（pyproject/declaration/dependency/plugin-contract/doctor/meta/lfs/docs）
  # + 子项目测试（xuan-cmd / xuan-compose）
  # ============================================
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install CMake + Ninja
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

      - name: Install project
        run: python -m pip install -e ".[dev]"

      # xs 声明 xuan-plugin / xuan-build / xuan-ffi / xuan-project 为运行时依赖（本地包，不在 PyPI），须先行安装
      - name: Install xuan-plugin kernel
        run: python -m pip install -e "libs/xuan-plugin[test]"

      - name: Install xuan-build capability
        run: python -m pip install -e "libs/xuan-build[test]"

      - name: Install xuan-ffi capability
        run: python -m pip install -e "libs/xuan-ffi[test]"

      - name: Install xuan-project capability
        run: python -m pip install -e "libs/xuan-project[test]"

      - name: Install xs-cli
        run: python -m pip install -e tools/xs/

      # --- 子项目测试：根 pytest 的 testpaths 仅覆盖 tests/，libs/* 的测试
      # 此前不进入任何 CI 步骤；三库均为纯 Python，Linux 单平台即可覆盖
      # （xuan-cmd 的 Windows 分支由 monkeypatch 在用例内模拟） ---
      - name: Run xuan-build tests
        run: |
          python -m pytest libs/xuan-build/tests

      - name: Run xuan-ffi tests
        run: |
          python -m pytest libs/xuan-ffi/tests

      - name: Run xuan-project tests
        run: |
          python -m pytest libs/xuan-project/tests

      - name: Run xuan-cmd tests
        run: |
          python -m pip install -e "libs/xuan-cmd[test]"
          cd libs/xuan-cmd
          python -m pytest

      - name: Run xuan-compose tests
        run: |
          python -m pip install -e "libs/xuan-compose[test]"
          cd libs/xuan-compose
          python -m pytest

      # --- okf 测试此前不在任何 CI 步骤中（根 pytest 的 testpaths 仅覆盖 tests/，
      # tools/* 的测试不进入；quality job 原仅覆盖 xuan-cmd / xuan-compose）。
      # 先装 xuan-plugin：okf 声明了 xuan-plugin>=0.1.0 运行时依赖，
      # 该包未发布到 PyPI，须由工作区先行提供以满足依赖解析。 ---
      - name: Run xuan-plugin + okf tests
        run: |
          python -m pip install -e "libs/xuan-plugin[test]"
          python -m pip install -e "tools/okf[dev]"
          cd libs/xuan-plugin
          python -m pytest
          cd ../../tools/okf
          python -m pytest

      # --- 0. pyproject.toml canonical 风格校验 ---
      - name: Check pyproject.toml canonical style
        run: python scripts/check_pyproject_style.py

      # --- 1. 声明—实现一致性校验（P0-4：CLI 命令/子项目/目录名/vendor/子模块/项目索引六类声明） ---
      - name: Check declaration consistency
        run: python scripts/check_declaration_consistency.py

      # --- 1b. 依赖方向断言（蓝图目标态特征 3：libs 不得依赖 apps/scripts/attic/vendor） ---
      - name: Check dependency direction
        run: python scripts/check_dependency_direction.py

      # --- 1c. spec 任务台账完整性（防并发写入导致的章节重复与半截合并） ---
      - name: Check spec integrity
        run: python scripts/check_spec_integrity.py

      # --- 1d. 插件契约 H 类断言（设计 §5.7：H1 可解性 / H2 隔离性 / H3 可撤销性 / H4 视图一致性 / H5 结构兼容） ---
      - name: Check plugin contract
        run: python scripts/check_plugin_contract.py

      # --- 2. 环境诊断 ---
      - name: xs doctor
        run: xs doctor

      # --- 3. 元数据校验 ---
      - name: xs meta validate
        run: xs meta validate

      # --- 4. LFS 大文件检查 ---
      - name: xs lfs check
        run: xs lfs check

      # --- 5. 文档构建 ---
      - name: xs doc build
        run: xs doc build

  # ============================================
  # 模板验证：三平台（Windows/macOS/Linux）模板创建 + 构建
  # ============================================
  template-validation:
    name: "Template / ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # --- CMake + Ninja 安装 ---
      - name: Install CMake + Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

      - name: Install CMake + Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake ninja

      - name: Install CMake + Ninja (Windows)
        if: runner.os == 'Windows'
        run: python -m pip install cmake ninja

      - name: Install project
        run: python -m pip install -e ".[dev]"

      # xs 声明 xuan-plugin / xuan-build / xuan-ffi / xuan-project 为运行时依赖（本地包，不在 PyPI），须先行安装
      - name: Install xuan-plugin kernel
        run: python -m pip install -e "libs/xuan-plugin[test]"

      - name: Install xuan-build capability
        run: python -m pip install -e "libs/xuan-build[test]"

      - name: Install xuan-ffi capability
        run: python -m pip install -e "libs/xuan-ffi[test]"

      - name: Install xuan-project capability
        run: python -m pip install -e "libs/xuan-project[test]"

      - name: Install xs-cli
        run: python -m pip install -e tools/xs/

      # --- Python 模板 ---
      - name: Create Python template project
        run: xs new --type python test-python-tpl

      - name: Build Python template project
        run: |
          cd libs/test-python-tpl
          python -m pip install -e .

      # --- Native 模板 ---
      - name: Create Native template project
        run: xs new --type native test-native-tpl

      - name: Build Native template project
        run: |
          cd libs/test-native-tpl
          python -m pip install -e . -v

      # --- Static 模板 ---
      - name: Create Static template project
        run: xs new --type static test-static-tpl

      - name: Verify Static template project
        run: |
          test -f apps/test-static-tpl/index.html && echo "Static template OK"

  # ============================================
  # Python 版本兼容性检查
  # ============================================
  py-compat:
    name: Python Compatibility Check
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install project
        run: python -m pip install -e ".[dev]"

      # xs 声明 xuan-plugin / xuan-build / xuan-ffi / xuan-project 为运行时依赖（本地包，不在 PyPI），须先行安装
      - name: Install xuan-plugin kernel
        run: python -m pip install -e "libs/xuan-plugin[test]"

      - name: Install xuan-build capability
        run: python -m pip install -e "libs/xuan-build[test]"

      - name: Install xuan-ffi capability
        run: python -m pip install -e "libs/xuan-ffi[test]"

      - name: Install xuan-project capability
        run: python -m pip install -e "libs/xuan-project[test]"

      - name: Install xs-cli
        run: python -m pip install -e tools/xs/

      - name: Check Python compatibility
        run: xs py-compat

      # 验证 Python < 3.14.6 时明确拒绝
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Verify Python < 3.14.6 is rejected
        run: |
          python -m pip install -e ".[dev]" 2>&1 || true
          xs --version 2>&1 || echo "Python 3.13 correctly rejected"
