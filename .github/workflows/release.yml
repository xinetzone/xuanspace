name: Release xs-cli

on:
  push:
    tags:
      - "xs-cli-v*"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "dry-run：构建但不发布正式版，改上传到 TestPyPI 验证"
        required: false
        default: "false"
        type: boolean

permissions:
  contents: read

jobs:
  # ============================================
  # 正式发布：推送 xs-cli-v* tag 时触发
  # ============================================
  release:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/xs-cli-v')
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install build dependencies
        run: python -m pip install --upgrade build twine

      - name: Build sdist + wheel
        working-directory: tools/xs
        run: python -m build

      - name: Check artifacts
        working-directory: tools/xs
        run: twine check dist/*

      - name: Upload to PyPI
        working-directory: tools/xs
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: python -m twine upload dist/*

  # ============================================
  # TestPyPI dry-run：手动触发（workflow_dispatch）
  # ============================================
  dry-run:
    name: TestPyPI dry-run
    if: github.event_name == 'workflow_dispatch' && inputs.dry-run
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install build dependencies
        run: python -m pip install --upgrade build twine

      - name: Build sdist + wheel
        working-directory: tools/xs
        run: python -m build

      - name: Check artifacts
        working-directory: tools/xs
        run: twine check dist/*

      - name: Upload to TestPyPI (dry-run)
        working-directory: tools/xs
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TEST_TOKEN }}
        run: python -m twine upload --repository-url https://test.pypi.org/legacy/ dist/*