[build-system]
requires = ["scikit-build-core>=0.10", "cmake>=3.26", "ninja>=1.11"]
build-backend = "scikit_build_core.build"

[project]
name = "xs-cli"
version = "0.1.0"
description = "Xuanspace xs CLI 工具"
readme = "README.md"
requires-python = ">=3.14.6"
keywords = ["xuanspace", "xuanjing", "cli", "monorepo", "devops"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "packaging>=24.0",
    "tomli-w>=1.0"
]
authors = [
    {name = "xinetzone"}
]
license = {text = "MIT"}

[project.urls]
Homepage = "https://github.com/xinetzone/xuanspace"
Repository = "https://github.com/xinetzone/xuanspace"
Issues = "https://github.com/xinetzone/xuanspace/issues"

[project.scripts]
xs = "xs.cli:app"

[tool.scikit-build]
minimum-version = "0.10"
wheel.py-api = "py3"
wheel.packages = ["xs"]
cmake.build-type = "Release"
ninja.make-fallback = false
build.verbose = true
editable.mode = "inplace"

sdist.include = [
    "/src/**/*.py",
    "/pyproject.toml",
    "/CMakeLists.txt",
    "/README.md",
]

sdist.exclude = [
    "**/.git",
    "**/__pycache__",
    "**/*.pyc",
    "build",
    "dist",
]
