[build-system]
requires = ["scikit-build-core>=0.11"]
build-backend = "scikit_build_core.build"

[project]
name = "xs-cli"
version = "0.1.0"
description = "Xuanspace xs CLI 工具"
readme = "README.md"
requires-python = ">=3.14.6"
keywords = ["xuanspace", "xuanjing", "cli", "monorepo", "devops"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Build Tools",
]
dependencies = [
  "typer>=0.12,<0.29",
  "rich>=13.0",
  "packaging>=24.0",
  "tomlkit>=0.12",
  "xuan-plugin>=0.1.0",
  "xuan-build>=0.1.0",
  "xuan-ffi>=0.1.0",
  "xuan-project>=0.1.0"
]
authors = [
  {name = "xinetzone"}
]
license = "Apache-2.0"

[project.urls]
Homepage = "https://github.com/xinetzone/xuanspace"
Repository = "https://github.com/xinetzone/xuanspace"
Issues = "https://github.com/xinetzone/xuanspace/issues"

[project.scripts]
xs = "xs.cli:app"

# 入口点通道（P1-3）：加载模块后读取其 MANIFEST，与静态清单合并去重。
[project.entry-points."xuan.plugins"]
"xs.commands" = "xs.plugins.commands"

# 纯 Python 包：wheel.cmake=false 禁用 CMake（无 CMakeLists.txt），
# 产出 py3-none-any 通用 wheel，构建无需 cmake/ninja。
[tool.scikit-build]
minimum-version = "0.11"
editable.mode = "inplace"

sdist.include = [
  "/src/**/*.py",
  "/pyproject.toml",
  "/README.md",
]

sdist.exclude = [
  "**/.git",
  "**/__pycache__",
  "**/*.pyc",
  "build",
  "dist",
]

[tool.scikit-build.wheel]
cmake = false
packages = ["src/xs"]

# 插件清单（K2）：把内置子命令声明为能力供应，供 `xs plugin list/graph` 与
# 运行时装配消费。cli.py 只做装配调用，命令对象由 xs.plugins.commands 登记。
# 声明与插件登记表的一致性由 tests/test_plugin_cmd.py 机检，防止双真相漂移。
[tool.xuan.plugin]
id = "xs.commands"
version = "0.1.0"
lifecycle = "reloadable"
reversible = true
priority = 100

# build 子命令的构建方式由该能力分派（P2-1）；xuan.build 提供，本插件注入。
[[tool.xuan.plugin.inject]]
key = "xuan:build/backend#dispatch"

[[tool.xuan.plugin.provide]]
key = "xuan:cli/commands#list"

[[tool.xuan.plugin.provide]]
key = "xuan:cli/commands#doctor"

[[tool.xuan.plugin.provide]]
key = "xuan:cli/commands#init"

[[tool.xuan.plugin.provide]]
key = "xuan:cli/commands#build"

[[tool.xuan.plugin.provide]]
key = "xuan:cli/commands#new"

[[tool.xuan.plugin.provide]]
key = "xuan:cli/commands#update"

[[tool.xuan.plugin.provide]]
key = "xuan:cli/commands#py-compat"

[[tool.xuan.plugin.provide]]
key = "xuan:cli/commands#affected"

[[tool.xuan.plugin.provide]]
key = "xuan:cli/commands#toolchain"

[[tool.xuan.plugin.provide]]
key = "xuan:cli/commands#deps"

[[tool.xuan.plugin.provide]]
key = "xuan:cli/commands#doc"

[[tool.xuan.plugin.provide]]
key = "xuan:cli/commands#version"

[[tool.xuan.plugin.provide]]
key = "xuan:cli/commands#meta"

[[tool.xuan.plugin.provide]]
key = "xuan:cli/commands#archive"

[[tool.xuan.plugin.provide]]
key = "xuan:cli/commands#lfs"

[[tool.xuan.plugin.provide]]
key = "xuan:cli/commands#plugin"