[build-system]
requires = ["scikit-build-core>=0.10"]
build-backend = "scikit_build_core.build"

[project]
name = "{{name}}"
version = "0.1.0"
description = "{{name}} - Xuanspace 纯Python子项目"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.14.6"
authors = [
    {name = "Xuanspace Team"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

# 纯 Python 包：wheel.cmake=false 显式禁用 CMake（模板不提供 CMakeLists.txt），
# scikit-build-core 直接按 wheel.packages 打包，产出 py3-none-any 通用 wheel；
# 构建全程无需 cmake/ninja（scikit-build-core 1.0+ 语义）。
[tool.scikit-build]
minimum-version = "0.10"

[tool.scikit-build.wheel]
cmake = false
packages = ["src/{{package_name}}"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]