<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{name}}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans SC", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
        }

        .container {
            background: white;
            padding: 3rem 4rem;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 600px;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: #666;
            font-size: 1.1rem;
            margin-bottom: 2rem;
        }

        .badge {
            display: inline-block;
            padding: 0.5rem 1rem;
            background: #f0f0f0;
            border-radius: 20px;
            font-size: 0.9rem;
            color: #555;
            margin-bottom: 2rem;
        }

        .content {
            text-align: left;
            line-height: 1.8;
        }

        footer {
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid #eee;
            color: #888;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>{{name}}</h1>
        <p class="subtitle">Xuanspace（玄境）静态项目模板</p>
        <span class="badge">静态 HTML/CSS/JS 项目</span>

        <div class="content">
            <p>欢迎使用 {{name}} 静态项目！</p>
            <p>在此处开始构建您的纯前端应用、工具页面或演示页面。</p>
        </div>

        <footer>
            <p>Xuanspace（玄境）Python monorepo</p>
            <p>无需 Python 环境，可直接在浏览器中打开 index.html</p>
        </footer>
    </div>

    <script>
        console.log("{{name}} 已加载");
    </script>
</body>
</html>
