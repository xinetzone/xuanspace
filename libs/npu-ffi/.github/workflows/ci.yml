name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python-version: "3.13"
            compiler: msvc
          - os: ubuntu-latest
            python-version: "3.13"
            compiler: gcc
          - os: macos-latest
            python-version: "3.13"
            compiler: clang

    runs-on: ${{ matrix.os }}
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake g++ libomp-dev
      
      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ninja cmake libomp
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install scikit-build-core ninja cmake
          pip install apache-tvm-ffi
          pip install "protobuf>=7.0.0" pytest
      
      - name: Build and install npu-ffi (stub mode)
        env:
          CMAKE_GENERATOR: Ninja
          KMP_DUPLICATE_LIB_OK: TRUE
        run: |
          pip install --no-build-isolation -e .
      
      - name: Run tests
        env:
          KMP_DUPLICATE_LIB_OK: TRUE
        run: |
          python -m pytest tests/python -v
      
      - name: Build wheel
        run: |
          pip wheel . -v --no-deps
      
      - name: Verify wheel
        env:
          KMP_DUPLICATE_LIB_OK: TRUE
        run: |
          pip install npu_ffi-*.whl --force-reinstall --no-deps
          python -c "import npu_ffi; print('npu-ffi version:', npu_ffi.__version__); from npu_ffi import vta; print('VTA module loaded successfully')"
