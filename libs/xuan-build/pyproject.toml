[build-system]
requires = ["scikit-build-core>=0.11"]
build-backend = "scikit_build_core.build"

[project]
name = "xuan-build"
version = "0.1.0"
description = "构建后端能力层：按项目类型分派 python/native/static 构建实现"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.14.6"
authors = [
    {name = "Xuanspace Team"}
]
keywords = [
    "xuanspace",
    "build",
    "backend",
    "plugin",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
  "xuan-plugin>=0.1.0"
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]

# 纯 Python 包：wheel.cmake=false 禁用 CMake（本库不提供 CMakeLists.txt）。
[tool.scikit-build]
minimum-version = "0.11"
build-dir = "build/{wheel_tag}"

[tool.scikit-build.wheel]
cmake = false
packages = ["src/xuan_build"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["src"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
pretty = true

# 插件清单（K2）：构建后端分派能力。消费者只需 inject
# `xuan:build/backend#dispatch`，不再在业务代码里按项目类型 if/elif。
[tool.xuan.plugin]
id = "xuan.build"
version = "0.1.0"
lifecycle = "reloadable"
reversible = true
priority = 50

[[tool.xuan.plugin.provide]]
key = "xuan:build/backend#dispatch"

# 入口点通道：加载模块后读取其 MANIFEST，与静态清单合并去重。
[project.entry-points."xuan.plugins"]
"xuan.build" = "xuan_build"
