[build-system]
requires = ["scikit-build-core>=0.11"]
build-backend = "scikit_build_core.build"

[project]
name = "xuan-ffi"
version = "0.1.0"
description = "FFI 能力键与子进程隔离代理：切换后端不改调用方代码"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.14.6"
authors = [
  {name = "Xuanspace Team"}
]
keywords = [
  "xuanspace",
  "ffi",
  "capability",
  "plugin",
  "subprocess",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "xuan-plugin>=0.1.0"
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
]

# 纯 Python 包：wheel.cmake=false 禁用 CMake（本库不提供 CMakeLists.txt）。
[tool.scikit-build]
minimum-version = "0.11"
build-dir = "build/{wheel_tag}"

[tool.scikit-build.wheel]
cmake = false
packages = ["src/xuan_ffi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["src"]
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
pretty = true

# 插件清单（K2）：每个内置 FFI 一条能力键。lifecycle="static" 表明原生
# 模块不承诺进程内卸载；子进程隔离是显式启用的可选传输（ADR-03）。
[tool.xuan.plugin]
id = "xuan.ffi"
version = "0.1.0"
lifecycle = "static"
reversible = true
priority = 40

[[tool.xuan.plugin.provide]]
key = "xuan:ffi/caffe#api"

[[tool.xuan.plugin.provide]]
key = "xuan:ffi/demo#api"

[[tool.xuan.plugin.provide]]
key = "xuan:ffi/npu#api"

# 入口点通道：加载模块后读取其 MANIFEST，与静态清单合并去重。
[project.entry-points."xuan.plugins"]
"xuan.ffi" = "xuan_ffi"
