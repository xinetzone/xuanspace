[build-system]
requires = ["scikit-build-core>=0.10", "cmake>=3.26", "ninja"]
build-backend = "scikit_build_core.build"

[project]
name = "xuan-ext-demo"
version = "0.1.0"
description = "Xuanspace C/C++ 原生扩展示例库"
requires-python = ">=3.14.6"
dependencies = []
authors = [
    {name = "xinetzone"}
]
license = {text = "MIT"}

[tool.scikit-build]
minimum-version = "0.10"
cmake.build-type = "Release"
wheel.packages = ["xuan_ext_demo"]
