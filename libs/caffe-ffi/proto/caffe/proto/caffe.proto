syntax = "proto2";

package caffe;

message BlobShape {
  repeated int64 dim = 1 [packed = true];
}

message BlobProto {
  optional BlobShape shape = 7;
  repeated float data = 5 [packed = true];
  repeated float diff = 6 [packed = true];
  repeated double double_data = 8 [packed = true];
  repeated double double_diff = 9 [packed = true];

  optional int32 num = 1 [default = 0];
  optional int32 channels = 2 [default = 0];
  optional int32 height = 3 [default = 0];
  optional int32 width = 4 [default = 0];
}

message BlobProtoVector {
  repeated BlobProto blobs = 1;
}

message FillerParameter {
  optional string type = 1 [default = 'constant'];
  optional float value = 2 [default = 0];
  optional float min = 3 [default = 0];
  optional float max = 4 [default = 1];
  optional float mean = 5 [default = 0];
  optional float std = 6 [default = 1];
  optional int32 sparse = 7 [default = -1];
  enum VarianceNorm {
    FAN_IN = 0;
    FAN_OUT = 1;
    AVERAGE = 2;
  }
  optional VarianceNorm variance_norm = 8 [default = FAN_IN];
}

message NetParameter {
  optional string name = 1;
  repeated string input = 3;
  repeated BlobShape input_shape = 8;
  repeated int32 input_dim = 4;
  optional bool force_backward = 5 [default = false];
  optional NetState state = 6;
  optional bool debug_info = 7 [default = false];
  repeated LayerParameter layer = 100;
}

enum Phase {
   TRAIN = 0;
   TEST = 1;
}

message NetState {
  optional Phase phase = 1 [default = TEST];
  optional int32 level = 2 [default = 0];
  repeated string stage = 3;
}

message NetStateRule {
  optional Phase phase = 1;
  optional int32 min_level = 2;
  optional int32 max_level = 3;
  repeated string stage = 4;
  repeated string not_stage = 5;
}

message ParamSpec {
  optional string name = 1;
  optional DimCheckMode share_mode = 2;
  enum DimCheckMode {
    STRICT = 0;
    PERMISSIVE = 1;
  }
  optional float lr_mult = 3 [default = 1.0];
  optional float decay_mult = 4 [default = 1.0];
}

message LayerParameter {
  optional string name = 1;
  optional string type = 2;
  repeated string bottom = 3;
  repeated string top = 4;
  optional Phase phase = 10;
  repeated float loss_weight = 5;
  repeated ParamSpec param = 6;
  repeated BlobProto blobs = 7;
  repeated bool propagate_down = 11;
  repeated NetStateRule include = 8;
  repeated NetStateRule exclude = 9;

  optional InputParameter input_param = 143;
  optional ReLUParameter relu_param = 123;
  optional LeakyReLUParameter leaky_relu_param = 157;
  optional InnerProductParameter inner_product_param = 117;
  optional SoftmaxParameter softmax_param = 125;
  optional FlattenParameter flatten_param = 135;
  optional ConvolutionParameter convolution_param = 106;
  optional PoolingParameter pooling_param = 121;
  optional BatchNormParameter batch_norm_param = 139;
  optional ScaleParameter scale_param = 142;
  optional BiasParameter bias_param = 141;
  optional LossParameter loss_param = 140;
  optional AccuracyParameter accuracy_param = 144;
  optional SigmoidParameter sigmoid_param = 145;
  optional TanHParameter tanh_param = 146;
  optional PReLUParameter prelu_param = 147;
  optional ELUParameter elu_param = 148;
  optional DropoutParameter dropout_param = 149;
  optional ConcatParameter concat_param = 150;
  optional EltwiseParameter eltwise_param = 151;
  optional ReshapeParameter reshape_param = 152;
  optional SliceParameter slice_param = 153;
  optional CropParameter crop_param = 154;
  optional LRNParameter lrn_param = 155;
  optional RecurrentParameter recurrent_param = 156;
  optional L2NormParameter l2_norm_param = 158;
  optional InstanceNormParameter instance_norm_param = 159;
  optional MarginRankingParameter margin_ranking_param = 160;
  optional HingeParameter hinge_param = 161;
  optional ThresholdParameter threshold_param = 162;
  optional PowerParameter power_param = 163;
  optional ClipParameter clip_param = 164;
  optional ExpParameter exp_param = 165;
  optional LogParameter log_param = 166;
  optional SwishParameter swish_param = 167;
  optional MVNParameter mvn_param = 168;
  optional ReductionParameter reduction_param = 169;
  optional TileParameter tile_param = 170;
  optional Im2colParameter im2col_param = 171;
  optional ArgMaxParameter argmax_param = 172;
  optional SPPParameter spp_param = 173;
  optional EmbedParameter embed_param = 174;
  optional BatchReindexParameter batch_reindex_param = 175;
  optional FilterParameter filter_param = 176;
  optional SigmoidCrossEntropyLossParameter sigmoid_cross_entropy_loss_param = 177;
  optional ParameterParameter parameter_param = 178;
  optional DataParameter data_param = 179;
  optional ImageDataParameter image_data_param = 180;
  optional HDF5DataParameter hdf5_data_param = 181;
  optional HDF5OutputParameter hdf5_output_param = 182;
  optional MemoryDataParameter memory_data_param = 183;
  optional WindowDataParameter window_data_param = 184;
  optional DummyDataParameter dummy_data_param = 185;
  optional PythonParameter python_param = 186;
  optional ContrastiveLossParameter contrastive_loss_param = 187;
  optional InfogainLossParameter infogain_loss_param = 188;
  optional UpsampleParameter upsample_param = 189;
}

message SigmoidParameter {
  enum Engine {
    DEFAULT = 0;
    CAFFE = 1;
    CUDNN = 2;
  }
  optional Engine engine = 1 [default = DEFAULT];
}

message TanHParameter {
  enum Engine {
    DEFAULT = 0;
    CAFFE = 1;
    CUDNN = 2;
  }
  optional Engine engine = 1 [default = DEFAULT];
}

message PReLUParameter {
  optional FillerParameter filler = 1;
  optional bool channel_shared = 2 [default = false];
}

message ELUParameter {
  optional float alpha = 1 [default = 1];
}

message DropoutParameter {
  optional float dropout_ratio = 1 [default = 0.5];
}

message ConcatParameter {
  optional uint32 concat_dim = 1 [default = 1];
  optional int32 axis = 2 [default = 1];
}

message EltwiseParameter {
  enum EltwiseOp {
    PROD = 0;
    SUM = 1;
    MAX = 2;
  }
  optional EltwiseOp operation = 1 [default = SUM];
  repeated float coeff = 2;
  enum Engine {
    DEFAULT = 0;
    CAFFE = 1;
    CUDNN = 2;
  }
  optional Engine engine = 3 [default = DEFAULT];
}

message ReshapeParameter {
  optional BlobShape shape = 1;
  optional int32 axis = 2 [default = 0];
  optional int32 num_axes = 3 [default = -1];
}

message InputParameter {
  repeated BlobShape shape = 1;
}

message ReLUParameter {
  optional float negative_slope = 1 [default = 0];
  enum Engine {
    DEFAULT = 0;
    CAFFE = 1;
    CUDNN = 2;
  }
  optional Engine engine = 2 [default = DEFAULT];
}

message LeakyReLUParameter {
  // Slope applied to negative inputs. Matches ReLUParameter.negative_slope
  // semantics but is a distinct layer type (x=0 is a C¹ kink when slope != 1).
  optional float negative_slope = 1 [default = 0.01];
}

message InnerProductParameter {
  optional uint32 num_output = 1;
  optional bool bias_term = 2 [default = true];
  optional FillerParameter weight_filler = 3;
  optional FillerParameter bias_filler = 4;
  optional int32 axis = 5 [default = 1];
  optional bool transpose = 6 [default = false];
}

message SoftmaxParameter {
  enum Engine {
    DEFAULT = 0;
    CAFFE = 1;
    CUDNN = 2;
  }
  optional Engine engine = 1 [default = DEFAULT];
  optional int32 axis = 2 [default = 1];
}

message FlattenParameter {
  optional int32 axis = 1 [default = 1];
  optional int32 end_axis = 2 [default = -1];
}

message ConvolutionParameter {
  optional uint32 num_output = 1;
  optional bool bias_term = 2 [default = true];
  repeated uint32 pad = 3;
  optional uint32 pad_h = 9 [default = 0];
  optional uint32 pad_w = 10 [default = 0];
  repeated uint32 kernel_size = 4;
  optional uint32 kernel_h = 11;
  optional uint32 kernel_w = 12;
  repeated uint32 stride = 5;
  optional uint32 stride_h = 13;
  optional uint32 stride_w = 14;
  repeated uint32 dilation = 18;
  optional uint32 dilation_h = 19;
  optional uint32 dilation_w = 20;
  optional uint32 group = 6 [default = 1];
  optional FillerParameter weight_filler = 7;
  optional FillerParameter bias_filler = 8;
  enum Engine {
    DEFAULT = 0;
    CAFFE = 1;
    CUDNN = 2;
  }
  optional Engine engine = 15 [default = DEFAULT];
  optional int32 axis = 16 [default = 1];
  optional bool force_nd_im2col = 17 [default = false];
}

message PoolingParameter {
  enum PoolMethod {
    MAX = 0;
    AVE = 1;
    STOCHASTIC = 2;
  }
  optional PoolMethod pool = 1 [default = MAX];
  optional uint32 pad = 3 [default = 0];
  optional uint32 pad_h = 9 [default = 0];
  optional uint32 pad_w = 10 [default = 0];
  optional uint32 kernel_size = 2;
  optional uint32 kernel_h = 11;
  optional uint32 kernel_w = 12;
  optional uint32 stride = 4 [default = 1];
  optional uint32 stride_h = 13;
  optional uint32 stride_w = 14;
  optional bool global_pooling = 15 [default = false];
  enum Engine {
    DEFAULT = 0;
    CAFFE = 1;
    CUDNN = 2;
  }
  optional Engine engine = 5 [default = DEFAULT];
  enum RoundMode {
    CEIL = 0;
    FLOOR = 1;
  }
  optional RoundMode round_mode = 16 [default = CEIL];
}

message BatchNormParameter {
  optional bool use_global_stats = 1;
  optional float moving_average_fraction = 2 [default = .999];
  optional float eps = 3 [default = 1e-5];
}

message ScaleParameter {
  optional int32 axis = 1 [default = 1];
  optional int32 num_axes = 2 [default = 1];
  optional bool bias_term = 3 [default = false];
  optional FillerParameter filler = 4;
  optional FillerParameter bias_filler = 5;
}

message BiasParameter {
  optional int32 axis = 1 [default = 1];
  optional int32 num_axes = 2 [default = 1];
  optional FillerParameter filler = 3;
}

message LossParameter {
  optional int32 ignore_label = 1;
  enum NormalizationMode {
    FULL = 0;
    VALID = 1;
    BATCH_SIZE = 2;
    NONE = 3;
  }
  optional NormalizationMode normalization = 3 [default = VALID];
  optional bool normalize = 2;
}

message AccuracyParameter {
  optional uint32 top_k = 1 [default = 1];
  optional int32 axis = 2 [default = 1];
  optional int32 ignore_label = 3;
}

message SliceParameter {
  optional int32 axis = 3 [default = 1];
  repeated uint32 slice_point = 2;
  optional uint32 slice_dim = 1 [default = 1];
}

message CropParameter {
  optional int32 axis = 1 [default = 2];
  repeated uint32 offset = 2;
}

message LRNParameter {
  optional uint32 local_size = 1 [default = 5];
  optional float alpha = 2 [default = 1.];
  optional float beta = 3 [default = 0.75];
  enum NormRegion {
    ACROSS_CHANNELS = 0;
    WITHIN_CHANNEL = 1;
  }
  optional NormRegion norm_region = 4 [default = ACROSS_CHANNELS];
  optional float k = 5 [default = 1.];
  enum Engine {
    DEFAULT = 0;
    CAFFE = 1;
    CUDNN = 2;
  }
  optional Engine engine = 6 [default = DEFAULT];
}

message RecurrentParameter {
  // The time step (sequence length) to unroll. The bottom blob is reshaped
  // to (T, N, D) where T = num_steps, N = batch, D = input_dim.
  optional uint32 num_steps = 1 [default = 100];

  // If true, the hidden state h_t is exposed as a top blob (in addition to
  // the per-timestep output). Unused currently; kept for Caffe compatibility.
  optional bool expose_hidden = 2 [default = false];

  // -------- Vanilla RNN / LSTM activation & weight layout --------
  // Activation applied to the recurrent cell. 'tanh' or 'relu'.
  optional string activation = 3 [default = "tanh"];

  // Whether to compute the hidden state with a bias term on the hidden
  // recurrence (b_hh). Caffe RNN uses b_hh often zero; kept for compat.
  optional bool debug_info = 4 [default = false];

  // dtype carrier for future quantized/other precision; reserved field.
  optional int32 dtype = 5 [default = 4];  // 4 = float32 (Caffe default)

  // Reserved for future recurrent cell variants (gru, peephole, etc.).
  reserved 6, 7, 8, 9, 10;
}

message L2NormParameter {
  // Normalization axis: the L2 norm is computed over all dimensions starting
  // at `axis` (default 1 = channel dim in NCHW, i.e. spatial-only norm).
  optional int32 axis = 1 [default = 1];
  // Small epsilon added inside the square root for numerical stability.
  optional float eps = 2 [default = 1e-5];
}

message InstanceNormParameter {
  // Epsilon added to variance for numerical stability.
  optional float eps = 1 [default = 1e-5];
  // If true, learns per-channel scale (gamma) and shift (beta) parameters.
  optional bool affine = 2 [default = false];
  // If true, uses running (global) statistics during inference; otherwise
  // computes per-instance statistics from the current batch.
  optional bool use_global_stats = 3 [default = false];
}

message MarginRankingParameter {
  // Margin in the ranking loss; default 1.0.
  optional float margin = 1 [default = 1.0];
  // Sign of the loss: 1 (positive) or -1 (negative). Used to flip the
  // direction of the pairwise ranking comparison.
  optional int32 sign = 2 [default = 1];
}

message HingeParameter {
  // Norm used for the hinge loss: L1 (sum of violations) or L2 (sum of
  // squared violations).
  enum Norm {
    L1 = 0;
    L2 = 1;
  }
  optional Norm norm = 1 [default = L1];
  // Axis along which the class scores are laid out (default 1 = channel in NCHW).
  optional int32 axis = 2 [default = 1];
}

// Threshold: y = (x > threshold) ? 1 : 0. x = threshold is mapped to 0.
message ThresholdParameter {
  optional float threshold = 1 [default = 0];
}

// Power: y = (shift + scale * x) ^ power.
message PowerParameter {
  optional float power = 1 [default = 1];
  optional float scale = 2 [default = 1];
  optional float shift = 3 [default = 0];
}

// Clip: y = min(max(x, lo), hi). If min/max not set, that bound is unbounded.
message ClipParameter {
  optional float min = 1;
  optional float max = 2;
}

// Exp: y = base ^ (shift + scale * x). base == -1 means natural e.
message ExpParameter {
  optional float base = 1 [default = -1];
  optional float scale = 2 [default = 1];
  optional float shift = 3 [default = 0];
}

// Log: y = log_base(shift + scale * x). base == -1 means natural e.
message LogParameter {
  optional float base = 1 [default = -1];
  optional float scale = 2 [default = 1];
  optional float shift = 3 [default = 0];
}

// Swish: y = x * sigmoid(beta * x).
message SwishParameter {
  optional float beta = 1 [default = 1];
}

// MVN: mean/variance normalization over the spatial dims (optionally across channels).
message MVNParameter {
  optional bool normalize_variance = 1 [default = true];
  optional bool across_channels = 2 [default = false];
  optional float eps = 3 [default = 1e-9];
}

// Reduction: reduce the blob along `axis` with one of SUM/ASUM/SUMSQ/MEAN,
// then scale the result by `coeff`.
message ReductionParameter {
  enum ReductionOp {
    SUM = 1;
    ASUM = 2;
    SUMSQ = 3;
    MEAN = 4;
  }
  optional ReductionOp operation = 1 [default = SUM];
  optional int32 axis = 2 [default = 0];
  optional float coeff = 3 [default = 1];
}

// Tile: replicate the input `tiles` times along `axis`.
message TileParameter {
  optional int32 axis = 1 [default = 1];
  optional int32 tiles = 2 [default = 1];
}

// Im2col: standalone im2col transform (kernel/pad/stride/dilation).
message Im2colParameter {
  repeated uint32 kernel_size = 1;
  optional uint32 kernel_h = 11;
  optional uint32 kernel_w = 12;
  repeated uint32 pad = 3;
  optional uint32 pad_h = 9;
  optional uint32 pad_w = 10;
  repeated uint32 stride = 4;
  optional uint32 stride_h = 13;
  optional uint32 stride_w = 14;
  repeated uint32 dilation = 5;
  optional uint32 dilation_h = 15;
  optional uint32 dilation_w = 16;
}

// ArgMax: return the indices (and optionally values) of the top_k largest entries.
message ArgMaxParameter {
  optional bool out_max_val = 1 [default = true];
  optional uint32 top_k = 2 [default = 1];
  optional int32 axis = 3 [default = 1];
}

// SPP: spatial pyramid pooling (pyramid_height levels, average or max).
message SPPParameter {
  enum PoolMethod {
    MAX = 0;
    AVE = 1;
    STOCHASTIC = 2;
  }
  optional uint32 pyramid_height = 1;
  optional PoolMethod pool = 2 [default = MAX];
}

// Embed: embedding / lookup layer with optional bias.
message EmbedParameter {
  optional uint32 num_output = 1;
  optional uint32 input_dim = 2;
  optional bool bias_term = 3 [default = true];
  optional FillerParameter weight_filler = 4;
  optional FillerParameter bias_filler = 5;
}

// BatchReindex: reorder the batch dimension according to an index blob.
message BatchReindexParameter {
}

// Filter: drop bottom blobs whose names are not listed in top_names.
message FilterParameter {
}

// SigmoidCrossEntropy loss: multi-label binary cross-entropy with a numerically
// stable sigmoid. No dedicated parameters.
message SigmoidCrossEntropyLossParameter {
}

// Parameter: a learnable parameter layer exposing a single trainable blob
// (no bottom, one top). The shape is given by `shape`.
message ParameterParameter {
  optional BlobShape shape = 1;
}

// Data: reads a batch of training data from a LEVELDB/LMDB source.
// In caffe-ffi the data is loaded through the Python/numpy bridge (no C++
// leveldb/lmdb dependency); the parameters are kept for caffex compatibility.
message DataParameter {
  enum DB {
    LEVELDB = 0;
    LMDB = 1;
  }
  // Specify the data source.
  optional string source = 1;
  // Specify the batch size.
  optional uint32 batch_size = 4;
  // The rand_skip variable is for the data layer to skip a few data points
  // to avoid all asynchronous sgd clients to start at the same point.
  optional uint32 rand_skip = 7 [default = 0];
  optional DB backend = 8 [default = LEVELDB];
  // Simple scaling and subtracting the data mean, if provided. Note that the
  // mean subtraction is always carried out before scaling.
  optional float scale = 2 [default = 1];
  optional string mean_file = 3;
  // Randomly crop an image.
  optional uint32 crop_size = 5 [default = 0];
  // Randomly mirror data.
  optional bool mirror = 6 [default = false];
  // Force the encoded image to have 3 color channels.
  optional bool force_encoded_color = 9 [default = false];
  // Prefetch queue.
  optional uint32 prefetch = 10 [default = 4];
}

// ImageData: reads a batch of images from a text file of (filename, label)
// pairs. Images are decoded through the Python/numpy bridge.
message ImageDataParameter {
  // Specify the data source.
  optional string source = 1;
  // Specify the batch size.
  optional uint32 batch_size = 4 [default = 1];
  // The rand_skip variable is for the data layer to skip a few data points.
  optional uint32 rand_skip = 7 [default = 0];
  // Whether or not ImageDataLayer should shuffle the list of files at every epoch.
  optional bool shuffle = 8 [default = false];
  // It will also resize images if new_height or new_width are not zero.
  optional uint32 new_height = 9 [default = 0];
  optional uint32 new_width = 10 [default = 0];
  // Specify if the images are color or gray.
  optional bool is_color = 11 [default = true];
  // Simple scaling and subtracting the data mean, if provided.
  optional float scale = 2 [default = 1];
  optional string mean_file = 3;
  // Randomly crop an image.
  optional uint32 crop_size = 5 [default = 0];
  // Randomly mirror data.
  optional bool mirror = 6 [default = false];
  optional string root_folder = 12 [default = ""];
}

// HDF5Data: reads a batch of data from HDF5 files. Data is loaded through
// the Python/h5py bridge (no C++ HDF5 dependency).
message HDF5DataParameter {
  // Specify the data source.
  optional string source = 1;
  // Specify the batch size.
  optional uint32 batch_size = 2;
  // Whether to shuffle the data.
  optional bool shuffle = 3 [default = false];
}

// HDF5Output: writes the top blob to an HDF5 file via the Python/h5py bridge.
message HDF5OutputParameter {
  optional string file_name = 1;
}

// MemoryData: feeds in-memory data (numpy/DLPack tensors) into the network.
// The batch is supplied by the Python side (e.g. via Net.set_input_arrays).
message MemoryDataParameter {
  optional uint32 batch_size = 1;
  optional uint32 channels = 2;
  optional uint32 height = 3;
  optional uint32 width = 4;
}

// WindowData: reads detection-window data. Windows are loaded through the
// Python/numpy bridge.
message WindowDataParameter {
  // Specify the data source.
  optional string source = 1;
  // Simple scaling and subtracting the data mean, if provided.
  optional float scale = 2 [default = 1];
  optional string mean_file = 3;
  // Specify the batch size.
  optional uint32 batch_size = 4;
  // Randomly crop an image.
  optional uint32 crop_size = 5 [default = 0];
  // Randomly mirror data.
  optional bool mirror = 6 [default = false];
  // Foreground (object) overlap threshold.
  optional float fg_threshold = 7 [default = 0.5];
  // Background (non-object) overlap threshold.
  optional float bg_threshold = 8 [default = 0.5];
  // Fraction of batch that should be foreground objects.
  optional float fg_fraction = 9 [default = 0.25];
  // Amount of contextual padding to add around a window.
  optional uint32 context_pad = 10 [default = 0];
  // Mode for cropping out a detection window: "warp" or "square".
  optional string crop_mode = 11 [default = "warp"];
  // cache_images: will load all images in memory for faster access.
  optional bool cache_images = 12 [default = false];
  // Append root_folder to locate images.
  optional string root_folder = 13 [default = ""];
}

// DummyData: fills any number of arbitrarily shaped blobs with random (or
// constant) data generated by "Fillers".
message DummyDataParameter {
  // This layer produces N >= 1 top blobs.  Specify 1 or N shape fields, and
  // 0, 1 or N data_fillers.
  repeated FillerParameter data_filler = 1;
  repeated BlobShape shape = 6;
  // 4D dimensions -- deprecated.  Use "shape" instead.
  repeated uint32 num = 2;
  repeated uint32 channels = 3;
  repeated uint32 height = 4;
  repeated uint32 width = 5;
}

// Python: a custom Python layer. The ffi bridge calls the module's setup /
// reshape / forward / backward methods.
message PythonParameter {
  optional string module = 1;
  optional string layer = 2;
  // Set to the attribute `param_str` of the PythonLayer object before setup().
  optional string param_str = 3 [default = ''];
  // DEPRECATED.
  optional bool share_in_parallel = 4 [default = false];
}

// ContrastiveLoss: Hadsell et al. 2006 contrastive loss over pairs of samples.
message ContrastiveLossParameter {
  // margin for dissimilar pair.
  optional float margin = 1 [default = 1.0];
  // legacy_version = false (default) uses (margin - d)^2 as proposed in the
  // Hadsell paper. legacy_version = true uses (margin - d^2), kept only to
  // reproduce existing models.
  optional bool legacy_version = 2 [default = false];
}

// InfogainLoss: information gain loss, optionally weighted by an infogain
// matrix read from `source`.
message InfogainLossParameter {
  // Specify the infogain matrix source.
  optional string source = 1;
  // axis of prob.
  optional int32 axis = 2 [default = 1];
}

// Upsample: nearest-neighbor upsampling by an integer `scale` factor.
// (caffex declares UpsampleLayer but ships no parameter message; caffe-ffi
// adds an explicit scale for a concrete, self-contained implementation.)
message UpsampleParameter {
  optional int32 scale = 1 [default = 2];
}
