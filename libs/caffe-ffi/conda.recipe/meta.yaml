{% set name = "caffe-ffi" %}
{% set version = "0.1.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  path: ..

build:
  number: 7
  skip: true  # [py<314]
  detect_binary_files_with_prefix: false   # RPATHs are all $ORIGIN/@loader_path-relative; no prefix replacement needed
  # NOTE: conda-build >=26.5 deprecates missing_dso_whitelist in favor of missing_dso_allowlist
  # (scheduled removal in 27.3). When upgrading conda-build to 26.5+, add missing_dso_allowlist
  # with the same entries. Both keys are supported in 26.5.x for forward compatibility.
  missing_dso_whitelist:
    # Linux shared objects
    - "*/libtvm_ffi*.so*"
    - "*/libopenblas*.so*"
    - "*/libprotobuf*.so*"
    # macOS dynamic libraries
    - "*/libtvm_ffi*.dylib"
    - "*/libopenblas*.dylib"
    - "*/libprotobuf*.dylib"
    # @rpath-relative references (macOS)
    - "@rpath/libtvm_ffi*.dylib"

requirements:
  build:
    - {{ compiler('cxx') }}
    - cmake>=3.26
    - ninja>=1.11
    - scikit-build-core>=0.10.0
    - patchelf  # [linux]
    - cctools   # [osx]   # provides install_name_tool, otool, nm (usually pre-installed, cctools ensures availability)
    - make      # [osx]
  host:
    - python>=3.14
    - pip
    - scikit-build-core>=0.10.0
    - libprotobuf>=7.0.0
    - protobuf>=7.0.0
    - numpy>=2.3
    - libopenblas
    - openblas   # provides cblas.h, openblas_config.h headers and libopenblas.so symlink for compile-time linking
    - cython>=3.2.8
    - typing-extensions>=4.5
    - setuptools-scm
    - llvm-openmp  # [osx]  # OpenMP support for BLAS on macOS (libomp)
    - macos-sdk {{ MACOSX_DEPLOYMENT_TARGET|default("10.15") }}  # [osx]
  run:
    - python>=3.14
    - protobuf>=7.0.0
    - numpy>=2.3
    - libopenblas
    - typing-extensions>=4.5
    - llvm-openmp  # [osx]

test:
  imports:
    - tvm_ffi
    - caffe_ffi
  commands:
    - python -c "import tvm_ffi; print('tvm-ffi version:', tvm_ffi.__version__)"
    - python -c "import caffe_ffi; print('caffe-ffi version:', caffe_ffi.version()); print('Native available:', caffe_ffi.is_available())"
    - python -c "from caffe_ffi import Blob; b = Blob([100]); b.fill(1.0); print('Blob test OK, size:', b.count())"
  requires:
    - pip
    - pytest>=8.0
  source_files:
    - tests/python/

about:
  home: https://github.com/xinetzone/caffe-ffi
  license: BSD-2-Clause
  license_file: LICENSE
  summary: Caffe FFI bindings using tvm-ffi native object system
  description: |
    caffe-ffi provides Caffe deep learning framework bindings using the
    tvm-ffi native object system, enabling zero-copy interop between
    Python and C++ with modern C++17 features. Supports BLAS acceleration
    via OpenBLAS and Python 3.14+. Includes a bundled tvm-ffi runtime
    compiled from local source.

extra:
  recipe-maintainers:
    - xinetzone
