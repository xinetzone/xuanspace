{% set name = "caffe-ffi" %}
{% set version = "1.2.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  path: ..

build:
  number: 8
  skip: true  # [py<314]
  detect_binary_files_with_prefix: false
  missing_dso_whitelist:
    - "*/libtvm_ffi*.so*"
    - "*/libopenblas*.so*"
    - "*/libprotobuf*.so*"
    - "*/libtvm_ffi*.dylib"
    - "*/libopenblas*.dylib"
    - "*/libprotobuf*.dylib"
    - "@rpath/libtvm_ffi*.dylib"
    - "*/tvm_ffi*.dll"
    - "*/openblas*.dll"
    - "*/libprotobuf*.dll"
    - "*/caffe_ffi*.pyd"

requirements:
  build:
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
    - cmake>=3.26
    - ninja>=1.11
    - scikit-build-core>=0.10.0
    - patchelf  # [linux]
    - cctools   # [osx]
    - make      # [osx]
    - cross-python_{{ target_platform }}  # [build_platform != target_platform]
    - python                               # [build_platform != target_platform]
    - cython>=3.2.8                        # [build_platform != target_platform]
    - numpy>=2.3                           # [build_platform != target_platform]
  host:
    - python>=3.14
    - pip
    - scikit-build-core>=0.10.0
    - libprotobuf>=7.0.0
    - protobuf>=7.0.0
    - numpy>=2.3
    - libopenblas
    - openblas
    - cython>=3.2.8
    - typing-extensions>=4.5
    - setuptools-scm
    - llvm-openmp  # [osx]
    - macos-sdk {{ MACOSX_DEPLOYMENT_TARGET|default("10.15") }}  # [osx]
  run:
    - python>=3.14
    - protobuf>=7.0.0
    - numpy>=2.3
    - libopenblas
    - typing-extensions>=4.5
    - llvm-openmp  # [osx]

test:
  imports:
    - tvm_ffi                                                              # [build_platform == target_platform]
    - caffe_ffi                                                            # [build_platform == target_platform]
  commands:
    - python -c "import tvm_ffi; print('tvm-ffi version:', tvm_ffi.__version__)"  # [build_platform == target_platform]
    - python -c "import caffe_ffi; print('caffe-ffi version:', caffe_ffi.version()); print('Native available:', caffe_ffi.is_available())"  # [build_platform == target_platform]
    - python -c "from caffe_ffi import Blob; b = Blob([100]); b.fill(1.0); print('Blob test OK, size:', b.count())"  # [build_platform == target_platform]
    - test -f $SP_DIR/caffe_ffi/_caffe_ffi*.so                              # [linux]
    - test -f $SP_DIR/caffe_ffi/_caffe_ffi*.dylib                           # [osx]
    - test -f $SP_DIR/tvm_ffi/lib/libtvm_ffi.so                             # [linux]
    - test -f $SP_DIR/tvm_ffi/lib/libtvm_ffi.dylib                          # [osx]
    - if not exist %SP_DIR%\caffe_ffi\_caffe_ffi*.pyd exit 1                # [win and build_platform == target_platform]
    - test -f $SP_DIR/caffe_ffi/_caffe_ffi*.pyd                             # [win and build_platform != target_platform]
    - test -f $SP_DIR/tvm_ffi/lib/tvm_ffi.dll                               # [win and build_platform != target_platform]
    - file $SP_DIR/caffe_ffi/_caffe_ffi*.so 2>/dev/null || true             # [linux and build_platform != target_platform]
    - file $SP_DIR/caffe_ffi/_caffe_ffi*.dylib 2>/dev/null || true          # [osx and build_platform != target_platform]
    - file $SP_DIR/tvm_ffi/lib/libtvm_ffi.so 2>/dev/null || true            # [linux and build_platform != target_platform]
    - file $SP_DIR/tvm_ffi/lib/libtvm_ffi.dylib 2>/dev/null || true         # [osx and build_platform != target_platform]
    - file $SP_DIR/caffe_ffi/_caffe_ffi*.pyd 2>/dev/null || true            # [win and build_platform != target_platform]
  requires:
    - pip
    - pytest>=8.0
  source_files:
    - tests/python/

about:
  home: https://github.com/xinetzone/caffe-ffi
  license: BSD-2-Clause
  license_file: LICENSE
  summary: Caffe FFI bindings using tvm-ffi native object system
  description: |
    caffe-ffi provides Caffe deep learning framework bindings using the
    tvm-ffi native object system, enabling zero-copy interop between
    Python and C++ with modern C++17 features. Supports BLAS acceleration
    via OpenBLAS and Python 3.14+. Includes a bundled tvm-ffi runtime
    compiled from local source.

extra:
  recipe-maintainers:
    - xinetzone
