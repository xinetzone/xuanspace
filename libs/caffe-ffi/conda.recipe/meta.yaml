{% set name = "caffe-ffi" %}
{% set version = "0.1.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  path: ..

build:
  number: 0
  skip: true  # [py<314]
  missing_dso_whitelist:
    - "*/libtvm_ffi*.so*"
    - "*/libopenblas*.so*"
    - "*/libprotobuf*.so*"

requirements:
  build:
    - {{ compiler('cxx') }}
    - cmake>=3.26
    - ninja>=1.11
    - scikit-build-core>=0.10.0
    - patchelf
  host:
    - python>=3.14
    - pip
    - libprotobuf>=7.0.0
    - protobuf>=7.0.0
    - numpy>=2.3
    - libopenblas
    - cython>=3.2.8
  run:
    - python>=3.14
    - protobuf>=7.0.0
    - numpy>=2.3
    - libopenblas
    - typing-extensions>=4.5

test:
  imports:
    - caffe_ffi
  commands:
    - python -c "import caffe_ffi; print('caffe-ffi version:', caffe_ffi.__version__); print('Native available:', caffe_ffi._ffi_api.is_available())"
    - python -c "from caffe_ffi import Blob; b = Blob([100]); b.fill(1.0); print('Blob test OK, size:', b.count())"
  requires:
    - pip
    - pytest>=8.0
  source_files:
    - tests/python/

about:
  home: https://github.com/xinetzone/caffe-ffi
  license: BSD-2-Clause
  license_file: LICENSE
  summary: Caffe FFI bindings using tvm-ffi native object system
  description: |
    caffe-ffi provides Caffe deep learning framework bindings using the
    tvm-ffi native object system, enabling zero-copy interop between
    Python and C++ with modern C++17 features. Supports BLAS acceleration
    via OpenBLAS and Python 3.14+.

extra:
  recipe-maintainers:
    - xinetzone
