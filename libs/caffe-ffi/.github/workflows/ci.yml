name: caffe-ffi CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Nightly build: 2:00 AM UTC daily
    - cron: "0 2 * * *"
  workflow_dispatch:

# Cancel in-flight runs on the same PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ────────────────────────────────────────────────────────────────
  # Build & Test matrix: Linux / macOS / Windows
  # ────────────────────────────────────────────────────────────────
  build-and-test:
    name: "${{ matrix.os }} / py${{ matrix.python-version }} / ${{ matrix.build_type }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux (primary) — Release + Debug with perf log verification
          - os: ubuntu-latest
            python-version: "3.14"
            build_type: Release
            enable_debug_log: "OFF"
          - os: ubuntu-latest
            python-version: "3.14"
            build_type: Debug
            enable_debug_log: "ON"
          # macOS
          - os: macos-latest
            python-version: "3.14"
            build_type: Release
            enable_debug_log: "OFF"
          # Windows
          - os: windows-latest
            python-version: "3.14"
            build_type: Release
            enable_debug_log: "OFF"

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # ── System dependencies ──
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build cmake g++ libomp-dev ccache

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ninja cmake ccache libomp

      - name: Install system dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          python -m pip install --upgrade pip
          pip install cmake ninja

      # ── CCache setup for faster rebuilds ──
      - name: Setup ccache (Linux/macOS)
        if: runner.os != 'Windows'
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ github.job }}-${{ matrix.os }}-${{ matrix.build_type }}

      # ── Install Python build & test dependencies ──
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            "numpy>=2.3" \
            "protobuf>=7.0.0" \
            "apache-tvm-ffi>0.1.12" \
            "pytest>=8.0" \
            scikit-build-core ninja cmake

      # ── InsertSplits DAG simulation cross-validation (zero-dep, runs before build) ──
      - name: Verify InsertSplits DAG simulation (built-in cases)
        run: |
          python scripts/viz_insert_splits.py --verify

      - name: Verify InsertSplits DAG simulation (real-network fixtures)
        run: |
          python scripts/viz_insert_splits.py --fixture-dir tests/protos/

      # ── Build & install caffe-ffi (editable) ──
      # CAFFE_USE_BLAS=OFF avoids OpenBLAS/MKL dependency (pure C++ fallback).
      # CAFFE_FFI_ENABLE_DEBUG_LOG controls [ACTIVATION-PERF] log visibility.
      - name: Build and install caffe-ffi
        env:
          CMAKE_GENERATOR: Ninja
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          SKBUILD_CMAKE_ARGS: >-
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
            -DCAFFE_CPU_ONLY=ON
            -DCAFFE_USE_BLAS=OFF
            -DCAFFE_FFI_ENABLE_DEBUG_LOG=${{ matrix.enable_debug_log }}
            -DCAFFE_FFI_BUILD_TESTS=OFF
            -DCAFFE_FFI_ENABLE_COW=ON
            -DCAFFE_FFI_ENABLE_COW_PHASE3=ON
          KMP_DUPLICATE_LIB_OK: TRUE
        run: |
          pip install --no-build-isolation -v -e .

      # ── Smoke test: verify import works ──
      - name: Verify caffe_ffi import
        run: |
          python -c "import caffe_ffi; print('caffe_ffi version:', caffe_ffi.__version__)"

      # ── Run full Python test suite ──
      - name: Run all Python tests
        env:
          KMP_DUPLICATE_LIB_OK: TRUE
        run: |
          python -m pytest tests/python -v --tb=short

      # ── Focused: activation backward gradient tests ──
      - name: Run activation backward tests
        env:
          KMP_DUPLICATE_LIB_OK: TRUE
        run: |
          python -m pytest tests/python/test_activation_backward.py -v --tb=long

      # ── [ACTIVATION-PERF] log verification (Debug build only) ──
      - name: Verify [ACTIVATION-PERF] backward log structure
        if: matrix.enable_debug_log == 'ON'
        env:
          KMP_DUPLICATE_LIB_OK: TRUE
        run: |
          python -c "
          import sys, io, textwrap
          import numpy as np
          from caffe_ffi import Net

          # Test ReLU perf log
          proto = textwrap.dedent('''
              name: 'perf_relu'
              input: 'data'
              input_dim: 1 input_dim: 1 input_dim: 4 input_dim: 5
              layer { name: 'r' type: 'ReLU' bottom: 'data' top: 'out' }
          ''')
          net = Net(proto)
          x = np.random.randn(1,1,4,5).astype(np.float32)
          dy = np.ones_like(x)

          old_err, sys.stderr = sys.stderr, io.StringIO()
          net.forward({'data': x}); net.backward({'out': dy})
          relu_log = sys.stderr.getvalue(); sys.stderr = old_err

          # Test TanH perf log
          proto_t = textwrap.dedent('''
              name: 'perf_tanh'
              input: 'data'
              input_dim: 1 input_dim: 1 input_dim: 4 input_dim: 5
              layer { name: 't' type: 'TanH' bottom: 'data' top: 'out' }
          ''')
          net_t = Net(proto_t)
          old_err, sys.stderr = sys.stderr, io.StringIO()
          net_t.forward({'data': x}); net_t.backward({'out': dy})
          tanh_log = sys.stderr.getvalue(); sys.stderr = old_err

          # Test ELU perf log
          proto_e = textwrap.dedent('''
              name: 'perf_elu'
              input: 'data'
              input_dim: 1 input_dim: 1 input_dim: 4 input_dim: 5
              layer { name: 'e' type: 'ELU' bottom: 'data' top: 'out' }
          ''')
          net_e = Net(proto_e)
          old_err, sys.stderr = sys.stderr, io.StringIO()
          net_e.forward({'data': x}); net_e.backward({'out': dy})
          elu_log = sys.stderr.getvalue(); sys.stderr = old_err

          # Test Sigmoid perf log
          proto_s = textwrap.dedent('''
              name: 'perf_sig'
              input: 'data'
              input_dim: 1 input_dim: 1 input_dim: 4 input_dim: 5
              layer { name: 's' type: 'Sigmoid' bottom: 'data' top: 'out' }
          ''')
          net_s = Net(proto_s)
          old_err, sys.stderr = sys.stderr, io.StringIO()
          net_s.forward({'data': x}); net_s.backward({'out': dy})
          sig_log = sys.stderr.getvalue(); sys.stderr = old_err

          for name, log in [('ReLU', relu_log), ('TanH', tanh_log),
                            ('ELU', elu_log), ('Sigmoid', sig_log)]:
              assert '[ACTIVATION-PERF]' in log, f'{name}: missing [ACTIVATION-PERF] tag'
              assert 'diff_in=' in log,  f'{name}: missing diff_in'
              assert 'diff_out=' in log, f'{name}: missing diff_out'
              assert 'time=' in log,     f'{name}: missing time'
              print(f'[OK] {name} perf backward log verified')
          "

      # ── Build wheel (Linux Release only) ──
      - name: Build wheel
        if: matrix.build_type == 'Release' && runner.os == 'Linux'
        run: |
          pip wheel . -v --no-deps -w dist
          ls -la dist/

      - name: Upload wheel artifact
        if: matrix.build_type == 'Release' && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: caffe-ffi-wheel-py${{ matrix.python-version }}-${{ matrix.os }}
          path: dist/*.whl

  # ────────────────────────────────────────────────────────────────
  # C++ unit tests (Linux only)
  # ────────────────────────────────────────────────────────────────
  cpp-tests:
    name: "C++ tests / ubuntu-latest"
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build cmake g++ libomp-dev ccache

      - name: Install Python dependencies (for protobuf/tvm-ffi discovery)
        run: |
          python -m pip install --upgrade pip
          pip install "numpy>=2.3" "protobuf>=7.0.0" "apache-tvm-ffi>0.1.12" ninja cmake

      # ── InsertSplits DAG simulation cross-validation (zero-dep Python reference) ──
      - name: Verify InsertSplits DAG simulation (built-in cases)
        run: |
          python scripts/viz_insert_splits.py --verify

      - name: Verify InsertSplits DAG simulation (real-network fixtures)
        run: |
          python scripts/viz_insert_splits.py --fixture-dir tests/protos/

      - name: Configure CMake with C++ tests enabled
        run: |
          cmake -S . -B build-cpp \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCAFFE_CPU_ONLY=ON \
            -DCAFFE_USE_BLAS=OFF \
            -DCAFFE_FFI_ENABLE_DEBUG_LOG=ON \
            -DCAFFE_FFI_BUILD_TESTS=ON \
            -DCAFFE_FFI_ENABLE_COW=ON \
            -DCAFFE_FFI_ENABLE_COW_PHASE3=ON

      - name: Build C++ targets
        run: |
          cmake --build build-cpp -j$(nproc)

      - name: Run C++ tests via ctest
        run: |
          cd build-cpp
          ctest --output-on-failure -j$(nproc)

  # ────────────────────────────────────────────────────────────────
  # Lint / code quality
  # ────────────────────────────────────────────────────────────────
  lint:
    name: "Lint (ruff)"
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff linter
        run: ruff check python/ tests/ scripts/

      - name: Check code formatting
        run: ruff format --check python/ tests/ scripts/

      # ── C¹ kink protection static check ──
      - name: Check C¹ kink protection in activation gradient tests
        run: python scripts/check_c1_kink_protection.py tests/python/ -v

  # ────────────────────────────────────────────────────────────────
  # Nightly: Extended gradient regression + pooling edge-case tests
  # ────────────────────────────────────────────────────────────────
  nightly:
    name: "Nightly: Gradient Regression & Edge Cases"
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build cmake g++ libomp-dev ccache

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            "numpy>=2.3" \
            "protobuf>=7.0.0" \
            "apache-tvm-ffi>0.1.12" \
            "pytest>=8.0" \
            scikit-build-core ninja cmake

      - name: Build and install caffe-ffi
        env:
          CMAKE_GENERATOR: Ninja
          KMP_DUPLICATE_LIB_OK: TRUE
          SKBUILD_CMAKE_ARGS: >-
            -DCMAKE_BUILD_TYPE=Release
            -DCAFFE_CPU_ONLY=ON
            -DCAFFE_USE_BLAS=OFF
            -DCAFFE_FFI_BUILD_TESTS=OFF
            -DCAFFE_FFI_ENABLE_COW=ON
            -DCAFFE_FFI_ENABLE_COW_PHASE3=ON
        run: |
          pip install --no-build-isolation -e .

      - name: Verify caffe_ffi import
        run: |
          python -c "import caffe_ffi; print('caffe_ffi version:', caffe_ffi.__version__)"

      # ── Nightly 1: Pooling tie-breaking & overlap accumulation (11 edge-case tests) ──
      - name: Run pooling tie-breaking and overlap accumulation tests
        env:
          KMP_DUPLICATE_LIB_OK: TRUE
        run: |
          python -m pytest tests/python/test_pooling_backward.py \
            -k "TestMaxPoolTieBreaking or TestPoolOverlapAccumulation" \
            -v --tb=long

      # ── Nightly 2: CLI smoke test (--help, error codes) ──
      - name: CLI smoke: --help returns 0
        run: |
          python tests/python/grad_regression_cli.py --help > /dev/null
          echo "PASS: --help exit code=$?"

      - name: CLI smoke: bad prototxt returns 2
        run: |
          python tests/python/grad_regression_cli.py \
            --prototxt /nonexistent.prototxt \
            --input data --output pool --dims 1 1 4 4 --quiet || RC=$?
          if [ "$RC" != "2" ]; then echo "FAIL: expected exit 2, got $RC"; exit 1; fi
          echo "PASS: bad prototxt exit code=$RC"

      - name: CLI smoke: bad ref module returns 2
        run: |
          TMPPROTO=$(mktemp)
          cat > "$TMPPROTO" << 'EOF'
          name: "test"
          input: "data"
          input_dim: 1 input_dim: 1 input_dim: 4 input_dim: 4
          EOF
          python tests/python/grad_regression_cli.py \
            --prototxt "$TMPPROTO" \
            --input data --output pool --dims 1 1 4 4 \
            --ref nonexistent:fn --quiet || RC=$?
          rm -f "$TMPPROTO"
          if [ "$RC" != "2" ]; then echo "FAIL: expected exit 2, got $RC"; exit 1; fi
          echo "PASS: bad ref exit code=$RC"

      # ── Nightly 3: CLI regression with reference backward (AVE pool) ──
      - name: CLI regression: AVE pool vs numpy reference
        run: |
          TMPPROTO=$(mktemp --suffix=.prototxt)
          cat > "$TMPPROTO" << 'EOF'
          name: "nightly_ave_pool"
          input: "data"
          input_dim: 1 input_dim: 1 input_dim: 6 input_dim: 6
          layer {
            name: "pool" type: "Pooling" bottom: "data" top: "pool"
            pooling_param { pool: AVE kernel_size: 2 stride: 2 }
          }
          EOF
          python tests/python/grad_regression_cli.py \
            --prototxt "$TMPPROTO" \
            --input data --output pool --dims 1 1 6 6 --seed 42 \
            --ref tests.python.test_pooling_backward:pooling_backward_np \
            --kwarg kernel_size=2 --kwarg stride=2 --kwarg pool_type=AVE \
            --rtol 1e-3 --atol 1e-4 \
            --json nightly-ave-pool.json
          rm -f "$TMPPROTO"
          echo "PASS: AVE pool regression passed"

      # ── Nightly 4: CLI regression with reference backward (MAX pool) ──
      - name: CLI regression: MAX pool vs numpy reference
        run: |
          TMPPROTO=$(mktemp --suffix=.prototxt)
          cat > "$TMPPROTO" << 'EOF'
          name: "nightly_max_pool"
          input: "data"
          input_dim: 1 input_dim: 1 input_dim: 5 input_dim: 5
          layer {
            name: "pool" type: "Pooling" bottom: "data" top: "pool"
            pooling_param { pool: MAX kernel_size: 3 stride: 2 }
          }
          EOF
          python tests/python/grad_regression_cli.py \
            --prototxt "$TMPPROTO" \
            --input data --output pool --dims 1 1 5 5 --seed 123 \
            --ref tests.python.test_pooling_backward:pooling_backward_np \
            --kwarg kernel_size=3 --kwarg stride=2 --kwarg pool_type=MAX \
            --rtol 1e-3 --atol 1e-4 \
            --json nightly-max-pool.json
          rm -f "$TMPPROTO"
          echo "PASS: MAX pool regression passed"

      # ── Nightly 5: CLI numerical gradient cross-validation (multiple seeds) ──
      - name: CLI numerical gradient: AVE pool multi-seed
        run: |
          TMPPROTO=$(mktemp --suffix=.prototxt)
          cat > "$TMPPROTO" << 'EOF'
          name: "nightly_numgrad"
          input: "data"
          input_dim: 1 input_dim: 1 input_dim: 4 input_dim: 4
          layer {
            name: "pool" type: "Pooling" bottom: "data" top: "pool"
            pooling_param { pool: AVE kernel_size: 2 stride: 2 }
          }
          EOF
          FAILED=0
          for seed in 0 1 42 123 456; do
            if ! python tests/python/grad_regression_cli.py \
              --prototxt "$TMPPROTO" \
              --input data --output pool --dims 1 1 4 4 --seed $seed \
              --rtol 1e-3 --atol 1e-4 --numerical-rtol 1e-2 --numerical-atol 1e-3 \
              --json nightly-numgrad-seed${seed}.json --quiet; then
              echo "FAIL: numerical grad seed=$seed"
              FAILED=$((FAILED+1))
            else
              echo "PASS: numerical grad seed=$seed"
            fi
          done
          rm -f "$TMPPROTO"
          if [ $FAILED -gt 0 ]; then echo "$FAILED seed(s) failed"; exit 1; fi

      # ── Nightly 6: Full pooling backward test suite ──
      - name: Run full pooling backward test suite
        env:
          KMP_DUPLICATE_LIB_OK: TRUE
        run: |
          python -m pytest tests/python/test_pooling_backward.py -v --tb=long

      # ── Upload nightly JSON results as artifacts ──
      - name: Upload nightly regression results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-gradient-regression-${{ github.run_id }}
          path: nightly-*.json

