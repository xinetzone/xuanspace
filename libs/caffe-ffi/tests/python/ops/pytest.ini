[pytest]
testpaths = ..
python_files = test_*.py
python_functions = test_*
addopts = -v --tb=short
markers =
    caffe: Caffe operator tests (requires pycaffe installed)
    slow: marks tests as slow (performance/benchmark tests, deselected with -m "not slow")
    edge: marks tests as edge case tests (boundary conditions, corner cases)
    correctness: marks tests as correctness validation tests
    performance: marks tests as performance/benchmark tests
    memory: marks tests as memory usage/leak tests
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:google.protobuf
    ignore::FutureWarning:numpy
