# SPDX-License-Identifier: GPL-2.0-only

[build-system]
requires = ["scikit-build-core>=0.10"]
build-backend = "scikit_build_core.build"

[project]
name = "xuan-compose"
version = "0.1.0"
description = "xuan-compose - 由 containers/podman-compose 1.6.0 分层重构的 Compose 规范编排引擎（Xuanspace 纯 Python 子项目）"
readme = "README.md"
license = "GPL-2.0-only"
requires-python = ">=3.14"
authors = [
    {name = "Xuanspace Team"}
]
keywords = [
    "podman",
    "podman-compose",
    "compose-spec",
    "container-orchestration",
    "xuanspace",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

# 对等上游 [project.scripts] podman-compose = "podman_compose:main"（FR-3）
[project.scripts]
xuan-compose = "xuan_compose.cli.main:main"

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "parameterized>=0.9",
]
lint = [
    "mypy>=1.10",
    "ruff>=0.4",
    "types-PyYAML>=6.0",
]

[dependency-groups]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "parameterized>=0.9",
]
lint = [
    "mypy>=1.10",
    "ruff>=0.4",
    "types-PyYAML>=6.0",
]

# 纯 Python 包：wheel.cmake=false 显式禁用 CMake（仓库根亦不提供 CMakeLists.txt），
# scikit-build-core 按 wheel.packages 直接打包，产出 py3-none-any 通用 wheel；
# sdist 构建同样无需 cmake/ninja（scikit-build-core 1.0+ 语义，见 build/wheel.py）。
[tool.scikit-build]
minimum-version = "0.10"
build-dir = "build/{wheel_tag}"

[tool.scikit-build.wheel]
cmake = false
packages = ["src/xuan_compose"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["src"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
pretty = true

[tool.coverage.run]
branch = true
source = ["src/xuan_compose"]
