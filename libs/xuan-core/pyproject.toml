[build-system]
requires = ["scikit-build-core>=0.10"]
build-backend = "scikit_build_core.build"

[project]
name = "xuan-core"
version = "0.1.0"
description = "Xuanspace 核心工具库"
requires-python = ">=3.14.6"
dependencies = []
authors = [
    {name = "xinetzone"}
]
license = {text = "MIT"}

# 纯 Python 包：wheel.cmake=false 禁用 CMake（无 CMakeLists.txt），
# 产出 py3-none-any 通用 wheel，构建无需 cmake/ninja。
[tool.scikit-build]
minimum-version = "0.10"

[tool.scikit-build.wheel]
cmake = false
packages = ["src/xuan_core"]